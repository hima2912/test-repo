kind: LLMProvider
apiVersion: api.ibm.com/v1
metadata:
  name: test-oai-vcs
  namespace: test-oai-vcs
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
  domain: ai-platform
spec:
  provider:
    type: openai
    operations:
      - InvokeOpenAiModels
      - InvokeOpenAiModelsId
      - InvokeOpenAiChatCompletions
      - InvokeOpenAiEmbeddings
    apiKeySecret: dsafd
    tlsClientProfile: tls-client-profile-default:1.0.0
    region: us-south
    opVersion: '2024-03-14'
    cachePolicy:
      cache:
        expire:
          static:
            seconds: 60
        scope:
          narrowScope: {}
        ignoreControlDirectives: true
  product:
    $ref: test-oai-vcs:product-test-oai-vcs-lgu8w:1.0
