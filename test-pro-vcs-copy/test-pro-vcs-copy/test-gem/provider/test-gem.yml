kind: LLMProvider
apiVersion: api.ibm.com/v1
metadata:
  name: test-gem
  namespace: test-pro-vcs
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
  domain: ai-platform
spec:
  provider:
    type: gemini
    operations:
      - InvokeGeminiModels
      - InvokeGeminiModelsId
      - InvokeGeminiGenerateContent
      - InvokeGeminiEmbedContent
      - InvokeGeminiBatchEmbedContents
      - InvokeGeminiCountTokens
