    tlsClientProfile: tls-client-profile-default:1.0.0
    region: us-south
    opVersion: '2024-03-14'
    cachePolicy:
      cache:
        expire:
          static:
            seconds: 60
        scope:
          narrowScope: {}
        ignoreControlDirectives: true
  product:
    $ref: test-pro-vcs:product-test-gem-e04zz:1.0
